
<!DOCTYPE html>
<html>
<body>

<h2>Student Management System</h2>

<button onclick="getStudent()">Get Student</button>

<p id="result"></p>

<script>
function getStudent(){
    fetch("https://jsonplaceholder.typicode.com/users/1")
    .then(response => response.json())
    .then(data => {
        document.getElementById("result").innerHTML =
        "Name: " + data.name +
        "<br>Email: " + data.email;
    });
}
</script>

</body>
</html>
